name: Inventory Alert

on:
  # 主管道改回本機 launchd（GitHub Actions 排程延遲嚴重，2026-05-05 改）
  # 這裡只留手動觸發，當本機電腦關機或 launchd 失效時，從 web UI 手動 Run workflow
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Restore credentials from secrets
        env:
          GSPREAD_CREDENTIALS_JSON: ${{ secrets.GSPREAD_CREDENTIALS_JSON }}
          GSPREAD_AUTHORIZED_USER_JSON: ${{ secrets.GSPREAD_AUTHORIZED_USER_JSON }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          mkdir -p ~/.gspread ~/.line
          printf '%s' "$GSPREAD_CREDENTIALS_JSON" > ~/.gspread/credentials.json
          printf '%s' "$GSPREAD_AUTHORIZED_USER_JSON" > ~/.gspread/authorized_user.json
          printf 'LINE_CHANNEL_ACCESS_TOKEN=%s\n' "$LINE_CHANNEL_ACCESS_TOKEN" > ~/.line/golden-peach-oa.env
          chmod 600 ~/.gspread/* ~/.line/*

      - name: Run inventory check + push
        run: python check_inventory.py --push
